# Прайс-лист платных API-провайдеров роя Nomad (задачи M-173 / N14, M-185, M-192; спека §3.3, §5.2).
# Тарифы указаны в USD за 1 000 000 токенов (input_per_m, output_per_m, cache_read_per_m,
# cache_write_per_m) плюс фиксированная плата за запрос request_fee_usd (если есть у провайдера).
# У каждого провайдера зафиксированы официальный источник (source_url) и дата сверки (source_date).
#
# Предполётный гард (money.py) считает верхнюю оценку (worst_case_usd) по этому файлу ДО отправки:
#   - входные токены берутся с коэффициентом запаса prompt_safety_factor и БЕЗ скидки на кэш;
#   - выходные токены берутся по полному потолку max_output_tokens (или default_max_output_tokens);
#   - закладывается буфер auxiliary_reserve_ratio (не менее auxiliary_min_reserve_usd) на
#     вспомогательные вызовы ядра без разреза по аккаунту (session_search, компрессор, память).
schema_version: 1

defaults:
  prompt_safety_factor: 1.15
  default_max_output_tokens: 4096
  auxiliary_reserve_ratio: 0.15
  auxiliary_min_reserve_usd: 0.0020

providers:
  deepseek:
    source_url: "https://api-docs.deepseek.com/quick_start/pricing"
    source_date: "2026-04-19"
    default_model: deepseek-chat
    models:
      deepseek-chat:
        input_per_m: 0.27
        output_per_m: 1.10
        cache_read_per_m: 0.07
        cache_write_per_m: 0.27
        request_fee_usd: 0.0
        default_max_output_tokens: 4096
      deepseek-reasoner:
        input_per_m: 0.55
        output_per_m: 2.19
        cache_read_per_m: 0.14
        cache_write_per_m: 0.55
        request_fee_usd: 0.0
        default_max_output_tokens: 8192

  gemini:
    source_url: "https://ai.google.dev/gemini-api/docs/pricing"
    source_date: "2026-04-19"
    default_model: gemini-2.5-pro
    models:
      gemini-2.5-pro:
        input_per_m: 1.25
        output_per_m: 10.00
        cache_read_per_m: 0.3125
