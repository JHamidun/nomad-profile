# Контракт плагина nomad с ядром Hermes (задача M-071). Читает selfcheck.py на каждом старте,
# сверяет tests/test_selfcheck.py.
contract_version: 1
plugin: nomad

hermes:
  # Нижняя граница — жёсткая. Та же строка стоит в plugin.yaml (requires_hermes: загрузчик ядра
  # пропускает плагин ещё до импорта) и в distribution.yaml (hermes_requires: `hermes profile install`
  # отказывает). Только «>=» и одна клауза: check_hermes_requires манифеста поставки понимает ровно
  # одну, а верхняя граница здесь выключила бы плагин после обновления ядра — и синхронизация,
  # которая принесла бы пакет под новое ядро, не запустилась бы уже никогда.
  requires: ">=0.21.0"
  # Проверенный диапазон — мягкий. Ядро вне него плагин не выключает: самопроверка пишет WARNING с
  # причиной в журнал (logs/agent.log и errors.log), и плагин работает дальше.
  verified: ">=0.21.3, <0.22.0"
  # Коммит апстрима, на котором прошли тесты плагина и патчи: тот же, что UPSTREAM_SHA в
  # .github/workflows/ci.yml и verified_on в patches/*/meta.yaml. Робот двигает все три вместе.
  verified_on: 71d34bad1045610252eda02ee79549436896e784
