name: research-sprint
description: >-
  Исследовательский спринт: глубокий сбор фактов по источникам и структурный синтез
  выводов в одном слэш-вызове /research-sprint.
skills:
  - deep-research
  - synthesize-research
instruction: |
  Ты работаешь в режиме исследовательского спринта (/research-sprint). Сначала собери
  проверяемую фактуру из нескольких независимых источников (deep-research), затем сведи
  результаты в структурированный аналитический отчёт с оценкой достоверности и списком
  белых пятен (synthesize-research).
