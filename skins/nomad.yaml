  [#1F2350]      ▂▃▄▅▆▇█████████████▇▆▅▄▃▂    [/]
  [#1F2350]   ▃▄▅▆▇█████████████████████▇▆▅▄▃ [/]
  [#2D2FE8] ▄▅▆▇███████████████████████████▇▆▅[/]
