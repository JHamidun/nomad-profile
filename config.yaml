# Шаблон настроек Nomad. ЧЕРНОВИК: заполнены только ключи, чьё действие я проверил запуском.
# Правило задачи W3-17: шаблон собирается ИЗ СПИСКА КЛЮЧЕЙ С ОБОСНОВАНИЕМ У КАЖДОГО, а не
# копированием конфига владельца. Причина конкретная: у владельца стоит
# updates.pre_update_backup: false, и копия его конфига лишила бы каждого покупателя штатного
# снимка баз перед обновлением — того самого, на который опирается вся стратегия откатов.

# ─────────────────────────────────────────────────────────────────────────────
# Отпечаток клиента — проверено запуском 20.09.2026
# ─────────────────────────────────────────────────────────────────────────────
# Эти три заголовка — то, что видит поставщик модели. Ключ model.default_headers сливается ПОВЕРХ
# штатных заголовков, и пользователь побеждает (agent/auxiliary_client.py:826
# _apply_user_default_headers). Замер: с этим блоком build_or_headers() отдаёт наши значения
# вместо hermes-agent.nousresearch.com / Hermes Agent / HermesAgent.
#
# Границы, которые эта настройка НЕ закрывает (и почему так и оставлено):
#   · путь подписки Anthropic — user-agent claude-code/<версия> (external, cli) + x-app cli.
#     Протокольная личность клиента подписки: подмена сломает авторизацию. Не трогаем.
#   · Kimi на проводе Anthropic и OpenCode — до них настройка не доходит, закрывает патч P3.
#   · originator официального эндпоинта Codex — настройка model.default_headers до него не доходит;
#     закрывает патч P8 (M-046): сохраняет протокольный codex_cli_rs для chatgpt.com/backend-api
#     и берёт первое слово X-Title в нижнем регистре на совместимых провайдерах.
model:
  default_headers:
    User-Agent: "NomadAgent/0.1.0"      # версия подставляется сборкой
    X-Title: "Nomad"                     # это читает панель OpenRouter
    HTTP-Referer: "https://hamidun.com"

# No remote model manifest or periodic Portal recommendations (D06).
# hermes_cli/model_catalog.py:209-211, :249-257; gateway/run_watchers.py:207-211.
model_catalog:
  enabled: false  # Stops the cold fetch and the gateway's +30s refresh.

# Pin startup auxiliary routes instead of discovering OpenRouter -> Nous.
# agent/auxiliary_client.py:5784-5857 reads these per-task overrides.
auxiliary:
  # Prevent text compression from entering provider discovery when keyless.
  # agent/auxiliary_client.py:5178-5184, :6882-6890.
  compression:
    provider: deepseek
  # tools/vision_tools.py:811-813 probes explicit THEN auto if no client exists.
  # A provider name alone is insufficient without credentials. The explicit
  # OpenRouter-compatible endpoint constructs a lazy client even while keyless,
  # so the first probe succeeds without network and never reaches auto/Nous.
  # agent/auxiliary_client.py:5367-5374, :4771-4809. Real inference needs a key.
  vision:
    provider: custom  # Selects the explicit-endpoint branch (:4771-4809).
    # Stops base-URL discovery/Nous fallback (:5367-5374).
    base_url: https://openrouter.ai/api/v1
    # Stops model discovery (:4797-4799); known model ID in auxiliary_client.py:910.
    model: google/gemini-3.6-flash
    # Resolve only a user-supplied key via env expansion, never ship one (M-085; recognized by _validate_config_key).
    api_key: "${OPENROUTER_API_KEY}"

# Не переключаться на запасных провайдеров мимо основного маршрута (задача M-097).
fallback_providers: []

# Disable anonymous Nous bootstrap even if the launcher enables guest onboarding.
# hermes_cli/anon_auth.py:145-158, :563-564.
nous:
  guest: false

# Keep aggregate collection and transmission explicitly off in the shipped profile.
# hermes_cli/config_defaults.py:2153-2161;
# hermes_cli/observability/relay_shared_metrics.py:775-784.
telemetry:
  shared_metrics:
    enabled: false  # Stops collection; config_defaults.py:2155 (default is also false).
    send: false  # Stops the sender thread; relay_shared_metrics.py:775-784.

# ─────────────────────────────────────────────────────────────────────────────
# Плагин Nomad — проверено на живом шлюзе 21.09.2026
# ─────────────────────────────────────────────────────────────────────────────
# Плагины в Hermes включаются явно (opt-in): по умолчанию не включено ничего
# (hermes_cli/plugins_cmd.py: `_config_name_set("plugins", "enabled")`). Без этой строки плагин
# лежит в профиле, но не грузится, и хук gateway:startup честно пишет «conductor loop not
# started — plugin 'nomad' is not enabled». То есть у покупателя дирижёр не запустился бы ни разу.
plugins:
  enabled:
    - nomad

# Режим поставки (задача N26). В проданной сборке — только `shipped`: дирижёр не пишет файлов с
# кредами и не стартует дорожки из пула аккаунтов (запрет «intermediate credentials» в условиях
# Anthropic). `owner_machine` ставится руками на машине владельца:
#   hermes config set nomad.pool_mode owner_machine
# Всё, кроме ровно `owner_machine`, считается `shipped` — включая нечитаемый конфиг.
nomad:
  # Боевой адрес Control Plane по умолчанию (задача M-068). Перекрывается переменной окружения
  # NOMADNET_CP_URL или настройкой plugins.entries.nomad.settings.cp_url.
  control_plane_url: https://cp.nomadnet.ai
  pool_mode: shipped
  # Заслонка платных провайдеров (задача M-162 / N5, спека §3.6). По умолчанию платные API-дорожки
  # (deepseek, gemini, kimi, perplexity, yandex) заперты: переменная окружения с ключом в системе
  # сама по себе не разрешает рою тратить деньги по счётчику. Покупатель включает провайдера явно:
  #   hermes config set nomad.paid_provider_allowlist '[deepseek]'
  paid_provider_allowlist: []
  # Ширина роя и потолки на цель/аккаунт/неделю (задача M-189, спека §5.2 и §8 Q6).
  # На Windows штатный потолок параллелизма по умолчанию None (MemTotal не читается,
  # hermes_cli/config_defaults.py:72, :1925) — то есть потолка нет вовсе. Задаём явные числа:
  #   · max_parallel: 25 — ответ владельца 20.09 (п. 10, спека §5.2).
  #   · max_cards_per_goal: 100 — потолок карточек на одну цель до декомпозиции (спека §5.2,
  #     ждёт подтверждения владельца в задаче M-190).
  #   · max_sessions_per_account / sessions_per_account: 2 — максимум одновременных сессий на один
  #     распознанный аккаунт подписки (спека §5.2, ждёт подтверждения в M-190).
  #   · weekly_window_pct / weekly_window_percent: 20 (weekly_window_share: 0.20) — доля недельного
  #     окна квоты на одну цель, 20 % (спека §5.2, ждёт подтверждения в M-190).
  swarm:
    max_parallel: 25
    max_cards_per_goal: 100
    max_sessions_per_account: 2
    sessions_per_account: 2
    weekly_window_pct: 20
    weekly_window_percent: 20
    weekly_window_share: 0.20
  # Аренда внешних карточек роя в kanban.db (задача M-166 / N24, спека §2.4):
  # явный TTL аренды в секундах без скрытого значения по умолчанию в коде (продление каждые TTL/3).
  lease:
    claim_ttl_s: 900

# ─────────────────────────────────────────────────────────────────────────────
# Обновления
# ─────────────────────────────────────────────────────────────────────────────
updates:
  # У владельца стоит false. Для покупателя обязателен снимок: без него откат после неудачного
  # обновления делать нечем. Приёмка W3-17: после `hermes update` в профиле появился снимок баз.
  # Пассивная фоновая проверка GitHub (banner.py -> source_check.check_for_updates(passive=True))
  # отключена, чтобы `hermes chat` не ходил в api.github.com (M-098 / PRB2: 0 внешних обращений).
  pre_update_backup: quick
  check: false

# ─────────────────────────────────────────────────────────────────────────────
# Внешний вид (терминал и веб-дашборд)
# ─────────────────────────────────────────────────────────────────────────────
display:
  # Без этого баннер берёт кадуцей Гермеса и надпись HERMES AGENT (banner.py:964, :1025).
  # Приёмка: tools/check_skin.py — зелёный.
  skin: nomad

dashboard:
  # Тема веб-дашборда из <home>/dashboard-themes/nomad.yaml (задача M-074 / B7).
  # Читается hermes_cli/web_routers/dashboard_ui.py:72 и web_server_dashboard.py:217
  # (_render_active_theme_bootstrap_css) и отдаёт палитру Nomad на первом же рендере.
  theme: nomad

# ─────────────────────────────────────────────────────────────────────────────
# Навыки (задача M-075 / W3-08)
# ─────────────────────────────────────────────────────────────────────────────
# Внешние каталоги навыков (hermes_cli/config_defaults.py:1449, agent/skill_utils.py:320).
# Относительные пути считаются от HERMES_HOME; навыки, объявленные во внешних каталогах,
# tools/skills_sync.py:295 (_defer_to_external) не дублирует в локальное дерево.
skills:
  external_dirs: []

# ─────────────────────────────────────────────────────────────────────────────
# Диспетчер kanban.db (задачи M-159, M-189)
# ─────────────────────────────────────────────────────────────────────────────
# Штатный автодиспетчер ядра (hermes_cli/kanban_db_dispatch.py:130) сверяет текущий профиль с
# kanban.dispatch_profiles (строки 193–221): если профиля нет в списке, dispatch_once возвращает
# {"skipped_nonspawnable": N} и не запускает ни одного воркера. В поставке Nomad разрешён только
# профиль `nomad`.
# На Windows штатный потолок kanban.max_in_progress по умолчанию None (hermes_cli/config_defaults.py:1925,
# MemTotal из /proc/meminfo не читается) — задаём явное число 25 по ширине роя (задача M-189, спека §8 Q6).
kanban:
  dispatch_profiles:
    - nomad
  max_in_progress: 25

# ─────────────────────────────────────────────────────────────────────────────
# Терминальные предохранители SAF1(а,б) (задача M-108, спека §6 SAF1)
# ─────────────────────────────────────────────────────────────────────────────
# Правила approvals.deny проверяются ядром в tools/approval_floors.py:217, :300 ДО проверки
# флага --yolo (HERMES_YOLO_MODE) и approvals.mode: off — совпавшая команда безусловно
# блокируется с записью в журнал даже у автономного воркера роя.
approvals:
  deny:
    # Запрет принудительной перезаписи удалённых веток (длинный флаг --force / --force-with-lease):
    # необратимо стирает коммиты в общем репозитории даже при запуске воркера с --yolo.
    - "*git push*--force*"
    # Запрет короткого флага принудительного пуша (`git push -f ...`): та же защита удалённой истории.
    - "*git push*-f *"
    # Запрет жёсткого сброса рабочего дерева и индекса (`git reset --hard`): уничтожает незакоммиченные
    # изменения пользователя и соседних задач без возможности восстановления из git reflog.
    - "*git reset --hard*"
    # Запрет рекурсивного принудительного удаления через PowerShell (`Remove-Item -Recurse -Force`):
    # штатный HARDLINE_PATTERNS ядра ловит POSIX `rm -rf /`, но не командлет PowerShell на Windows.
    - "*Remove-Item*-Recurse*-Force*"
    # Запрет зеркального порядка флагов `Remove-Item -Force -Recurse` в PowerShell на Windows.
    - "*Remove-Item*-Force*-Recurse*"
    # Запрет интерактивной/скриптовой переразметки дисков через `diskpart` на Windows: в DANGEROUS_PATTERNS
    # он лишь запрашивает подтверждение и под --yolo прошёл бы без спроса.
    - "*diskpart*"
    # Запрет удаления веток системного реестра Windows (`reg delete`): под --yolo штатный детектор
    # пропускает DANGEROUS_PATTERNS, поэтому фиксируем безусловный запрет в approvals.deny.
    - "*reg delete*"
    # Запрет остановки или перезагрузки хост-машины через командлеты PowerShell (`Stop-Computer`,
    # `Restart-Computer`): выключает хост вместе со шлюзом и всеми активными воркерами роя.
    - "*Stop-Computer*"
    # Запрет перезагрузки хоста через PowerShell `Restart-Computer` (пара к `Stop-Computer`).
    - "*Restart-Computer*"

# Постоянный белый список команд терминала (tools/approval_floors.py:188, tools/approval.py:168).
# Команды из этого списка (без неэкранированных операторов оболочки `;`, `|`, `&`, `>`, `$()`)
# проходят через check_all_command_guards без интерактивного запроса подтверждения.
command_allowlist:
  # Чтение состояния рабочей копии git воркерами и проверками перед коммитом.
  - "git status*"
  # Просмотр диффа рабочей копии и коммитов при ревью и самопроверке воркера.
  - "git diff*"
  # Чтение истории коммитов репозитория при анализе контекста задачи.
  - "git log*"
  # Штатная уборка временных веток карточек `task/*` после слияния ворктри: в DANGEROUS_PATTERNS
  # любой `git branch -D` помечен как опасный, но ветки с префиксом `task/` создаются самим роем.
  - "git branch -D task/*"
  # Запуск тестового набора проекта напрямую через `pytest` на гейтах верификации.
  - "pytest *"
  # Модульный запуск `python -m pytest` в виртуальном окружении проекта без ручного подтверждения.
  - "python -m pytest *"

# ─────────────────────────────────────────────────────────────────────────────
# Делегирование под-агентов и голосовой ввод (задача M-085 / W3-17)
# ─────────────────────────────────────────────────────────────────────────────
# Потолок одновременно запущенных дочерних под-агентов внутри одного воркера (в апстриме по умолчанию 10,
# hermes_cli/config_defaults.py). Задаём 3, чтобы один воркер не раздувал дерево процессов при параллельной
# работе роя; общая ширина роя (25 параллельно) задаётся отдельно в nomad.swarm и kanban.max_in_progress (M-189).
delegation:
  max_concurrent_children: 3

# Распознавание речи (STT): в апстриме по умолчанию стоит "en", что ломает транскрибацию русской речи.
# Пустая строка включает автоопределение языка (русский / смешанный RU+EN) без принудительного английского.
stt:
  language: ""

# ─────────────────────────────────────────────────────────────────────────────
# Статичная обрезка промпта без модели (задача M-247 / J-006 / W3-17)
# ─────────────────────────────────────────────────────────────────────────────
# Отключение нестабильного зонда окружения Python (tools/env_probe.py): строка «Python toolchain»
# даёт варианты между сессиями и рвёт префиксный кэш DeepSeek/Sonnet после ~1 920 токенов (R-token-anatomy).
# При выключении системный промпт побайтно одинаков (md5) между сессиями, давая кэш >= 80%.
agent:
  environment_probe: false

# Откладывание тяжёлых схем инструментов (надмножество _DEFAULT_DEFERRED_TOOLS ядра):
# схемы инструментов первого запроса ужимаются с 9 067 до <= 5 000 токенов o200k (25 -> 12 инструментов).
# Отложенные схемы (браузер browser_*, delegate_task, execute_code, memory, search_files и др.)
# вызываются моделью через прогрессивный мост tool_search / tool_describe / tool_call.
tools:
  tool_search:
    defer:
      - annotate_preview
      - apply_layout
      - browser_back
      - browser_cdp
      - browser_click
      - browser_console
      - browser_dialog
      - browser_exec
      - browser_get_images
      - browser_navigate
      - browser_press
      - browser_scroll
      - browser_snapshot
      - browser_type
      - browser_vault_enter_code
      - browser_vault_fill
      - browser_vault_list
      - browser_vault_save_login
      - browser_vault_unlock
      - browser_vision
      - clarify
      - close_terminal
      - computer_use
      - cronjob_manage
      - delegate_task
      - desktop_preview
      - desktop_project
      - drive_preview
      - execute_code
      - focus_pane
      - gui_tour
      - image_generate
      - manage_catalog
      - memory
      - process_manage
      - read_terminal
      - read_window_below
      - search_files
      - session_search
      - show_tip
      - text_to_speech
      - todo_list
      - vision_analyze

# ─────────────────────────────────────────────────────────────────────────────
# Штатные MCP-серверы поставки Nomad (задача M-080 / W3-11)
# ─────────────────────────────────────────────────────────────────────────────
# Девять собственных MCP-серверов размещены в package/mcp-servers/<name>/server.py и объявлены напрямую
# в mcp_servers: (отдельный mcp.json упразднён: ядро читает config.yaml -> mcp_servers в hermes_cli/mcp_config.py
# и tools/mcp_tool.py). Поле tools у каждого сервера — словарь (dict) для тонкой фильтрации include/exclude.
# При включённом nomad.ru_only: true серверы ru-*, yandex-* и bitrix24 проверяют белый список РФ/TLS до сокета.
mcp_servers:
  # CRM и задачи Битрикс24 через входящий REST-вебхук портала
  bitrix24:
    command: "python"
    args:
      - "${HERMES_HOME}/mcp-servers/bitrix24/server.py"
    env:
      BITRIX24_WEBHOOK_URL: "${BITRIX24_WEBHOOK_URL}"
    tools: {}
  # Локальная база знаний профиля (индексация и полнотекстовый поиск документов)
  knowledge-base:
    command: "python"
    args:
      - "${HERMES_HOME}/mcp-servers/knowledge-base/server.py"
    env:
      KNOWLEDGE_BASE_DIR: "${HERMES_HOME}/knowledge"
    tools: {}
  # Локальный мост к классическому Microsoft Outlook на Windows через MAPI COM
  outlook-local:
    command: "python"
    args:
      - "${HERMES_HOME}/mcp-servers/outlook-local/server.py"
    env: {}
    tools: {}
  # Проверка российских контрагентов (ЕГРЮЛ/ЕГРИП/ФНС) по ИНН и ОГРН через DaData РФ
  ru-counterparty:
    command: "python"
    args:
      - "${HERMES_HOME}/mcp-servers/ru-counterparty/server.py"
    env:
      DADATA_API_KEY: "${DADATA_API_KEY}"
      DADATA_SECRET_KEY: "${DADATA_SECRET_KEY}"
    tools: {}
  # Открытые государственные данные РФ и курсы Банка России (cbr.ru / data.gov.ru)
  ru-open-data:
    command: "python"
    args:
      - "${HERMES_HOME}/mcp-servers/ru-open-data/server.py"
    env: {}
    tools: {}
  # Отправка уведомлений и проверка статуса бота через Telegram Bot API
  telegram-bot:
    command: "python"
    args:
      - "${HERMES_HOME}/mcp-servers/telegram-bot/server.py"
    env:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_DEFAULT_CHAT_ID: "${TELEGRAM_DEFAULT_CHAT_ID}"
    tools: {}
  # Облачное хранилище Яндекс.Диск через официальный REST API cloud-api.yandex.net
  yandex-disk:
    command: "python"
    args:
      - "${HERMES_HOME}/mcp-servers/yandex-disk/server.py"
    env:
      YANDEX_DISK_TOKEN: "${YANDEX_DISK_TOKEN}"
    tools: {}
  # Почтовый клиент Яндекс.Почты по защищённым протоколам IMAP/SMTP (imap.yandex.ru / smtp.yandex.ru)
  yandex-mail:
    command: "python"
    args:
      - "${HERMES_HOME}/mcp-servers/yandex-mail/server.py"
    env:
      YANDEX_MAIL_USER: "${YANDEX_MAIL_USER}"
      YANDEX_MAIL_APP_PASSWORD: "${YANDEX_MAIL_APP_PASSWORD}"
    tools: {}
  # Веб-аналитика и счётчики Яндекс.Метрики через api-metrika.yandex.net
  yandex-metrika:
    command: "python"
    args:
      - "${HERMES_HOME}/mcp-servers/yandex-metrika/server.py"
    env:
      YANDEX_METRIKA_TOKEN: "${YANDEX_METRIKA_TOKEN}"
    tools: {}

# ─────────────────────────────────────────────────────────────────────────────
# Ключи, которые ЕЩЁ НЕ внесены, и что каждый ждёт
# ─────────────────────────────────────────────────────────────────────────────
# compression.threshold, model_thresholds, protect_last_n — механизм у владельца уже настроен и
#                                работает; трогать запрещено его же словами, для покупателя
#                                значения выбираются отдельно и с замером.
# ttl_minutes — снят решением D06 (удалённый каталог моделей выключен: model_catalog.enabled: false).
