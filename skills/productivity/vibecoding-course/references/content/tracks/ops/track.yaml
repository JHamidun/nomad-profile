# Трек роли «Операции» (ops). Читают скиллы course-driver / course-check.
# Порядок миссий = порядок в списке. id = имя файла без .md.
role: ops
title: Операции
description: >
  Трек операционщика: превращаем процессы из головы и рутину из рук
  в работающие инструменты — чек-лист процесса, генератор документов,
  отчёт из выгрузки, скрипт-рутина. Финал — собственный внутренний тул
  с интеграцией в Google Sheets/Notion.

missions:
  - id: m01-process-checklist
    file: m01-process-checklist.md
    title: Процесс из головы — в чек-лист
    goal: Описать реальный процесс проверяемыми шагами и собрать по нему интерактивный чек-лист.
    criteria: process.md со шагами и признаками «сделано»; index.html с кликабельными галочками, открывается в браузере.

  - id: m02-doc-generator
    file: m02-doc-generator.md
    title: Генератор однотипных документов
    goal: Собрать генератор — шаблон + таблица данных, документы для всего списка одной командой.
    criteria: template.md с плейсхолдерами; data.csv минимум на 5 строк; папка out/ с сгенерированными документами; перегенерация при смене данных.

  - id: m03-csv-report
    file: m03-csv-report.md
    title: Отчёт, который собирается сам
    goal: Превратить сырую CSV-выгрузку в отчёт для руководителя, пересобираемый на новых данных.
    criteria: data.csv; REPORT.md с итогами и разбивкой; HOW-TO.md как пересобрать; на изменённых данных цифры меняются.

  - id: m04-routine-script
    file: m04-routine-script.md
    title: Рутина — в скрипт с RUNBOOK
    goal: Автоматизировать свою повторяющуюся файловую рутину и задокументировать так, чтобы запустил коллега.
    criteria: рабочий скрипт на демо-файлах; RUNBOOK.md с командой запуска и разбором сбоев; git-история в папке рутины.

final_project:
  id: project
  file: project.md
  title: Операционный пульт — внутренний тул
  goal: >
    Собрать внутренний тул под свой участок работы: данные в CSV,
    дашборд index.html, скрипт-рутина обновления и интеграция
    с Google Sheets или Notion (онлайн — по желанию, офлайн — экспорт CSV).
  criteria: >
    Тул открывается и показывает реальные данные; рутина пересобирает его
    одной командой по RUNBOOK.md; INTEGRATION.md описывает и демонстрирует
    путь данных в Sheets/Notion; история изменений в git.
