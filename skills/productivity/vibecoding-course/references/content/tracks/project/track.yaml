# Трек роли «Проджект-менеджер». Манифест трека: миссии и финальный проект.
# Порядок прохождения = порядок файлов: m01 → m02 → m03 → m04 → project.md.
# Читают course-driver (навигация) и course-check (критерии). Формат миссий — как в tracks/_core/.
version: 1
track: project
role: project
title: Проджект-менеджер
goal: >
  Ученик собирает себе рабочий контур управления проектом: единый реестр задач,
  доска статусов для планёрки, статус-отчёт, который собирается из данных сам,
  и мост к трекеру команды (импорт экспорта, экспорт в чат). Всё — руками,
  вместе с агентом, на задачах его реального проекта.
prerequisites:
  - _core   # фундамент m00–m02 пройден: намерения, бриф, цикл план→результат→git→деплой

knowledge:
  - .course/knowledge/project/00-single-source-of-truth.md
  - .course/knowledge/project/01-status-report.md
  - .course/knowledge/project/02-data-bridges.md

missions:
  - id: m01-task-registry
    file: m01-task-registry.md
    title: Один источник правды
    time: 30–45 минут
    goal: >
      Собрать задачи реального проекта из чатов и головы в структурированный
      реестр tasks.json со схемой полей и написанными правилами статусов.
    criteria:
      - sandbox/pm/tracker/tasks.json существует, задачи с полями id, title, owner, due, status
      - sandbox/pm/tracker/STATUS-RULES.md описывает статусы и правило «когда задача красная»
      - ученик отвечает по реестру (сколько в работе, что ближе всего к сроку), не открывая чатов

  - id: m02-status-board
    file: m02-status-board.md
    title: Доска для планёрки
    time: 40–60 минут
    goal: >
      Собрать из tasks.json доску статусов board.html — колонки по статусам,
      просрочки подсвечены — и уметь пересобирать её при изменении данных.
    criteria:
      - sandbox/pm/tracker/board.html открывается в браузере двойным кликом (без сервера)
      - на доске видны реальные задачи из tasks.json, просрочка выделена
      - ученик меняет статус задачи и показывает пересобранную доску

  - id: m03-auto-report
    file: m03-auto-report.md
    title: Отчёт, который собирает себя
    time: 40–60 минут
    goal: >
      Согласовать шаблон статус-отчёта (светофор, сделано, риски, нужно от заказчика)
      и получать report.md из tasks.json без ручного написания текста.
    criteria:
      - sandbox/pm/report/TEMPLATE.md со структурой отчёта и правилом светофора
      - sandbox/pm/report/report.md собран из данных, без выдуманных фактов
      - смена статуса в tasks.json меняет отчёт при пересборке (демо наставнику)

  - id: m04-team-tracker-bridge
    file: m04-team-tracker-bridge.md
    title: Мост к трекеру команды
    time: 30–45 минут
    goal: >
      Провести данные через мост: CSV-экспорт из трекера команды → tasks.json
      (с маппингом статусов) → доска и отчёт; плюс короткая версия отчёта для чата.
    criteria:
      - sandbox/pm/integration/export.csv (реальный экспорт или учебный в чужом формате)
      - маппинг статусов зафиксирован в STATUS-RULES.md
      - sandbox/pm/report/for-chat.txt — версия отчёта для мессенджера
      - задача из экспорта доехала до доски и отчёта (демо наставнику)

final_project:
  id: project
  file: project.md
  title: "Свой контур: трекер + авто-отчёт + интеграция"
  time: 90–120 минут (можно в два подхода)
  goal: >
    Ученик с нуля, полным циклом из фундамента (план → сборка → git → опционально деплой),
    собирает под свой реальный проект собственный контур: реестр задач со своей схемой,
    доску под свою планёрку, авто-отчёт по своему шаблону и минимум один мост
    к внешнему инструменту. Плюс README — как этим пользоваться через месяц.
  criteria:
    - sandbox/pm/final/PLAN.md — план из проверяемых шагов, написанный до сборки
    - реестр с ≥10 реальными задачами, доска board.html, отчёт report.md + версия для чата
    - минимум один мост: импорт экспорта трекера ИЛИ экспорт наружу (чат/письмо/календарь)
    - git-история минимум из 3 коммитов в sandbox/pm/final
    - README.md с инструкцией «как обновить данные и пересобрать доску и отчёт»
    - живое демо: обновил данные → пересобрал → показал мост
