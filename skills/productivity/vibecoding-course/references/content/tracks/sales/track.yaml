# Трек роли «Продажи». Читают course-driver / course-check.
track: sales
title: Продажи
language: ru

# Сквозная идея трека: от быстрых побед (калькулятор КП) к собственному
# инструменту — мини-CRM с лид-скорингом и аутрич-цепочкой. Каждая миссия
# отдаёт кусок, который встанет в финальный проект.

missions:
  - id: m01-kp-calculator
    file: m01-kp-calculator.md
    title: "Калькулятор КП — считай варианты за минуту"
    goal: "Ученик умеет превратить свой прайс и правила скидок в работающий калькулятор, который считает варианты КП без Excel и без ошибок в формулах."
    time: "40–60 минут"
    criteria:
      - "OFFER.md с позициями и правилами скидок — написан учеником, не агентом"
      - "kp-calc/index.html открывается в браузере и считает по правилам из OFFER.md"
      - "смена количества/позиции пересчитывает итог, скидка применяется корректно"

  - id: m02-lead-base
    file: m02-lead-base.md
    title: "База лидов — порядок из хаоса"
    goal: "Ученик умеет привести сырую выгрузку лидов в чистую таблицу по своим правилам: дубли, битые почты, пустые поля — найдены и разобраны, с отчётом."
    time: "40–60 минут"
    criteria:
      - "leads-raw.csv (демо или обезличенная реальная выгрузка) и чистый leads.csv"
      - "CLEANING.md — правила чистки словами ученика"
      - "REPORT.md — что было, что стало, сколько дублей и битых записей"

  - id: m03-lead-scoring
    file: m03-lead-scoring.md
    title: "Лид-скоринг — правила вместо чуйки"
    goal: "Ученик умеет оцифровать свою интуицию «этот лид горячий»: правила скоринга на бумаге, баллы и грейды A/B/C в таблице, топ на экране."
    time: "~60 минут"
    criteria:
      - "SCORING.md — критерии, баллы и пороги грейдов, написанные учеником"
      - "leads-scored.csv — те же лиды с колонками score и grade"
      - "scoreboard.html — топ лидов с сортировкой по баллу"
      - "изменение правила в SCORING.md меняет порядок после пересчёта"

  - id: m04-outreach-chain
    file: m04-outreach-chain.md
    title: "Аутрич-цепочка — три касания без спама"
    goal: "Ученик умеет описать цепочку из трёх касаний с переменными персонализации и получить готовые черновики писем под конкретных лидов из своей базы."
    time: "60–90 минут"
    criteria:
      - "SEQUENCE.md — три касания: цель, тема, скелет с переменными"
      - "outbox/ — сгенерированные черновики писем под топ-лидов + INDEX.md"
      - "персонализация подставлена из базы, а не оставлена как {имя}"
      - "ничего не отправляется автоматически — outbox только черновики"

final_project:
  id: project
  file: project.md
  title: "Мини-CRM — пайплайн, скоринг и касания в одном месте"
  goal: "Ученик собирает под ведением агента свой рабочий инструмент: локальная мини-CRM со стадиями сделок, подсветкой скоринга, письмами цепочки в один клик и утренним брифом «кого касаться сегодня»."
  time: "2–3 часа, можно в несколько подходов"
  criteria:
    - "PLAN.md из проверяемых шагов — до кода"
    - "crm/index.html: лиды из leads-scored.csv, стадии, смена стадии сохраняется между открытиями"
    - "письмо касания для лида открывается из карточки с подставленной персонализацией"
    - "«Кого касаться сегодня»: список по правилу (грейд + давность касания + активная стадия)"
    - "git-история минимум из 3 коммитов; данные лидов НЕ публикуются в интернет"

pass_threshold_default: 70
