# Трек роли «Фаундер». Читают course-driver / course-check / наставник.
# Пререквизит: пройден общий фундамент tracks/_core (m00–m02).
version: 1
track: founder
title: Фаундер
description: >
  От идеи до продукта под ключ: сначала проверяем спрос страницей с оффером,
  потом считаем юнит-экономику, собираем бота-приёмщика заявок, упаковываем
  тарифы с подготовленным приёмом оплаты — и в финале связываем всё в один
  продукт: лендинг + бот + оплата.
knowledge:
  - .course/knowledge/core/
  - .course/knowledge/founder/

missions:
  - id: m01-smoke-landing
    file: m01-smoke-landing.md
    title: "Смоук-тест: лендинг раньше продукта"
    goal: "Собрать продающую страницу с оффером и формой заявки — и проверять спрос до того, как строить продукт"
    criteria:
      - "offer.md: Для кого, Боль, Оффер одной фразой, Действие"
      - "landing/index.html открывается в браузере, есть форма заявки"
      - "заголовок страницы = оффер, а не название компании"
    time: "40–60 мин"

  - id: m02-unit-economics
    file: m02-unit-economics.md
    title: "Юнит-экономика: живой калькулятор вместо «потом посчитаю»"
    goal: "Собрать интерактивный калькулятор LTV / CAC / прибыли и отвечать инвестору цифрами"
    criteria:
      - "calc/index.html: входные параметры меняются, LTV, LTV/CAC и прибыль пересчитываются"
      - "assumptions.md: параметры с источниками + три сценария"
      - "формулы сверены с ручным счётом на круглом примере"
    time: "30–45 мин"

  - id: m03-lead-bot
    file: m03-lead-bot.md
    title: "Бот-приёмщик заявок"
    goal: "Собрать мозг бота — сценарий квалификации заявки, прогоняемый локально без токенов и сети"
    criteria:
      - "scenario.md: приветствие + 3–5 шагов-вопросов + финальный ответ"
      - "node sandbox/founder/bot/dry-run.js проходит сценарий и выходит с кодом 0"
      - "заявка сохраняется в leads.json с полями, нужными для продажи"
    time: "45–60 мин"

  - id: m04-pricing-payment
    file: m04-pricing-payment.md
    title: "Тарифы и приём оплаты"
    goal: "Упаковать цену из калькулятора в страницу тарифов и подготовить приём оплаты до кнопки «Купить»"
    criteria:
      - "pricing/index.html: карточки тарифов с кнопкой «Купить», цены сходятся с калькулятором"
      - "PAYMENTS.md: Провайдер (и почему), Что нужно, Куда вставить ссылку"
      - "у каждого тарифа свой «для кого»"
    time: "30–45 мин"

final_project:
  id: project
  file: project.md
  title: "Продукт под ключ: лендинг + бот + приём оплаты"
  goal: >
    Собрать из наработок трека цельный продукт под ведением агента:
    лендинг с оффером и тарифами, бот-приёмщик заявок, подготовленный приём
    оплаты — в одном репозитории с git-историей и (при желании) публичной ссылкой.
  criteria:
    - "PLAN.md из 4–6 проверяемых шагов, собрано по плану"
    - "index.html: оффер + тарифы + CTA в один путь клиента"
    - "бот работает на новом месте: node product/bot/dry-run.js"
    - "PAYMENTS.md и DEPLOY.md на месте (деплой или честная пометка «локально»)"
    - "git-история минимум из 3 коммитов"
    - "ученик прогоняет путь клиента целиком: страница → тариф → заявка → куда платить"
  time: "90–120 мин, можно в два подхода"

pass_threshold_default: 70
