# Трек роли «Маркетолог». Читают course-driver / course-check / наставник.
# Открывается после фундамента (_core, миссии m00–m02) — порядок задан в .course/config.yaml.
version: 1
track: marketer
title: Маркетолог
after: _core

# Сквозная легенда трека: одна рекламная кампания, которую ученик доводит
# от размеченных ссылок до дашборда. Каждая миссия — рабочий кусок этой кампании.

missions:
  - id: m03-utm-links
    title: Кампания без слепых зон (UTM-разметка + свой генератор ссылок)
    goal: Ученик размечает ссылки кампании по единому словарю UTM и собирает себе генератор ссылок, которым реально пользуется.
    criteria:
      - есть словарь меток utm-rules.md (source/medium/campaign + правила написания)
      - работает генератор utm/index.html со значениями из словаря
      - ученик объясняет, что кладёт в source, medium и campaign

  - id: m04-campaign-landing
    title: Лендинг кампании за вечер
    goal: Ученик формулирует оффер и собирает с агентом лендинг с одним CTA, который отвечает на «что это / почему мне / почему сейчас» за 5 секунд.
    criteria:
      - offer.md с блоками «для кого», «обещание», «почему сейчас», CTA
      - landing/index.html с одним главным CTA и формой
      - форма запоминает utm-метки из адреса (скрытые поля)

  - id: m05-content-pipeline
    title: Контент-конвейер — один источник, три канала
    goal: Ученик строит конвейер «source.md + recipe.md → посты», который перегенерирует контент после правки источника, а не переписывает посты руками.
    criteria:
      - source.md с офферами, фактами и запретными фразами
      - recipe.md с форматами под TG / VK / email
      - минимум 3 поста в posts/, ссылки в постах — с UTM

  - id: m06-metrics-dashboard
    title: Дашборд, который отвечает на «ну как кампания?»
    goal: Ученик собирает одностраничный дашборд из выгрузки (CSV → CTR/CR/CPL по каналам) и принимает решение о бюджете не по одному CPL.
    criteria:
      - data.csv с колонками channel/spend/impressions/clicks/leads
      - dashboard/index.html считает CTR, CR, CPL по каналам и итог
      - ученик обосновывает, какой канал масштабировать (смотрит на всю воронку)

final_project:
  id: project
  title: Кампания под ключ
  goal: >
    Ученик связывает всё в один продукт: лендинг кампании + авто-контент +
    дашборд метрик, с планом, хабом-оглавлением, git-историей и (по желанию)
    публичной ссылкой. Полный цикл: пост с UTM-ссылкой → лендинг → форма
    с метками → строка в данных → дашборд.
  criteria:
    - PLAN.md из проверяемых шагов
    - хаб index.html со ссылками на лендинг, контент и дашборд
    - git-история минимум из 3 коммитов
    - DEPLOY.md с публичной ссылкой или пометкой «локально»
    - сквозное демо от поста до дашборда

# Порог зачёта — по умолчанию из .course/config.yaml (70), в миссиях указан явно.
