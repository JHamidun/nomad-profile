# Трек роли «Дизайнер». Читают course-driver / course-check.
# Порядок миссий = порядок в списке; после миссий — финальный проект.
version: 1
role: designer
title: Дизайнер
summary: >
  От статичного макета — к живому дизайн-проекту: страница из макета,
  дизайн-токены, кликабельный прототип с состояниями, генерация ассетов,
  и финал — цельный пакет «прототип + мини дизайн-система + графика».

knowledge:
  - .course/knowledge/core/        # общие принципы вайбкодинга
  - .course/knowledge/designer/    # роль-специфичные атомы (язык дизайна, токены, состояния)

missions:
  - id: m01-live-mockup
    file: m01-live-mockup.md
    title: Макет, который открывается
    goal: >
      Превращать статичный макет в живую HTML-страницу, управляя агентом
      языком дизайна (иерархия, шкала, отступы), а не правками «чуть левее».
    criteria:
      - SPEC.md с блоками «Иерархия», «Палитра», «Типографика», «Сетка»
      - index.html открывается в браузере и собран по спеке
      - страница не разваливается на узкой ширине экрана
      - ученик сверяет результат со спекой, а не «на глаз»

  - id: m02-design-tokens
    file: m02-design-tokens.md
    title: Токены вместо ручной перекраски
    goal: >
      Выносить дизайн-решения в токены (CSS-переменные в одном файле)
      и делать ребрендинг страницы правкой двух-трёх строк.
    criteria:
      - tokens.css с :root — цвета, шрифтовая шкала, отступы, радиусы
      - страница подключает tokens.css и использует var(--…)
      - смена значения токена перекрашивает страницу без правки разметки

  - id: m03-clickable-prototype
    file: m03-clickable-prototype.md
    title: Прототип, который можно потыкать
    goal: >
      Собирать кликабельный прототип из 3+ экранов с переходами
      и состояниями (empty, error), работающий офлайн из одного файла.
    criteria:
      - FLOW.md с картой экранов и таблицей состояний
      - переходы между экранами работают по кликам, без интернета
      - у ключевого экрана есть empty- и error-состояния с текстом и действием
      - стили прототипа — на токенах проекта

  - id: m04-asset-factory
    file: m04-asset-factory.md
    title: Ассеты без стоков
    goal: >
      Ставить агенту арт-дирекшн через стиль-спеку и получать консистентный
      набор SVG-графики (иконки, логотип, фавиконка) в цветах токенов.
    criteria:
      - STYLE.md — стиль-спека (сетка, штрих, скругления, цвета по токенам)
      - 6+ SVG-иконок по спеке, логотип и фавиконка в том же стиле
      - витрина index.html, где весь набор виден рядом
      - правки набора идут через спеку, а не поштучной вкусовщиной

final_project:
  id: project
  file: project.md
  title: Свой живой дизайн-проект
  goal: >
    Собрать под ведением агента цельный проект по своей рабочей задаче:
    интерактивный прототип + мини дизайн-система (токены, компоненты,
    принципы) + сгенерированные ассеты — всё связано, в git, готово к показу.
  criteria:
    - design-system/ — tokens.css, components.html (ядро с состояниями), README с принципами
    - prototype/ — кликабельный флоу 3+ экранов на токенах и компонентах системы
    - assets/ — иконки, логотип, фавиконка по стиль-спеке, подключены к прототипу
    - git-история минимум из 3 коммитов по слоям
    - демо-прогон: флоу кликается, состояния переключаются, смена токена перекрашивает всё
