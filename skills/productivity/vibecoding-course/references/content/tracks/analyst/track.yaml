# Трек роли «Аналитик». Навигационная карта для course-driver / course-check.
# Порядок прохождения: после tracks/_core (m00–m02) — миссии этого трека по номерам,
# затем финальный проект (project.md).
track: analyst
title: Аналитик
version: 1
requires: _core

description: >
  Ученик проходит путь аналитика с ИИ-агентом на реальных задачах роли:
  разведка чужой выгрузки → воспроизводимая очистка → ответы на бизнес-вопросы
  через SQL с проверкой чисел → самодостаточный HTML-дашборд → финальный проект:
  конвейер «сырые данные → одна команда → дашборд + авто-отчёт с выводами».
  Всё офлайн: CSV + SQLite + Python + git, без внешних сервисов и секретов.

missions:
  - id: m03-data-audit
    file: m03-data-audit.md
    title: "Разведка данных: чужая выгрузка"
    goal: "Разобрать незнакомый CSV с агентом за полчаса: что внутри, где грязь, каким числам можно верить"
    criteria:
      - "sandbox/datalab/raw.csv существует (свои данные или сгенерированная агентом реалистичная выгрузка)"
      - "sandbox/datalab/AUDIT.md: разделы «Что за данные», «Находки» (минимум 3 проблемы с примерами), «Вопросы к владельцу данных»"
      - "Ученик объясняет, какому выводу по этим данным нельзя верить, пока проблемы не сняты"

  - id: m04-clean-pipeline
    file: m04-clean-pipeline.md
    title: "Очистка, которую можно перезапустить"
    goal: "Превратить разовую чистку в скрипт: raw → clean.csv + лог; исходник неприкосновенен, перезапуск даёт тот же результат"
    criteria:
      - "sandbox/datalab/clean.py запускается из корня папки курса и отрабатывает без ошибок"
      - "clean.csv и CLEANLOG.md пересобираются, raw.csv не изменён"
      - "CLEANLOG.md объясняет, сколько строк было/стало и что почему удалено или исправлено"
      - "git-история в sandbox/datalab"

  - id: m05-ask-your-data
    file: m05-ask-your-data.md
    title: "Три вопроса руководителя (SQL)"
    goal: "Отвечать на бизнес-вопросы через SQLite и агента — и проверять числа перекрёстно, прежде чем отправлять"
    criteria:
      - "sandbox/datalab/data.db — данные загружены в SQLite"
      - "queries.sql — запросы по трём вопросам"
      - "answers.md: по каждому вопросу — Вопрос / Ответ / Как проверил"
      - "Ученик объясняет один запрос своими словами"

  - id: m06-dashboard
    file: m06-dashboard.md
    title: "Дашборд вместо скриншота"
    goal: "Собрать самодостаточный HTML-дашборд: 2–3 графика, каждый отвечает на вопрос, открывается без интернета и установки"
    criteria:
      - "sandbox/datalab/dashboard.html открывается локально при выключенном интернете"
      - "Данные зашиты в файл, внешних ссылок нет"
      - "Заголовок каждого графика — вывод, а не «График 1»"
      - "Числа на графиках сходятся с answers.md"

final_project:
  id: project
  file: project.md
  title: "Отчёт, который собирается сам"
  goal: >
    Конвейер под ключ: сырые данные (CSV или SQLite) → одна команда →
    очистка → метрики → out/dashboard.html + out/REPORT.md с автоматическими
    выводами по правилам, которые сформулировал ученик. Обновились данные —
    пересобрал за минуту.
  criteria:
    - "sandbox/report-factory/PLAN.md — план из проверяемых шагов"
    - "python sandbox/report-factory/build.py отрабатывает из корня папки курса и пересобирает out/"
    - "out/dashboard.html и out/REPORT.md существуют, REPORT.md содержит раздел «Выводы»"
    - "README.md объясняет запуск и куда класть свежие данные"
    - "git-история минимум из 2 коммитов"
    - "Демонстрация: подменил данные → пересобрал → числа и выводы изменились сами"

pass_threshold_default: 70
