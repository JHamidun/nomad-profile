# Трек роли: HR / рекрутер. Читают наставник (Claude Code) и скиллы курса.
version: 1
role: hr
title: HR / рекрутер
requires: _core   # сначала фундамент: m00–m02 общего трека

# Сквозная линия трека: от заявки на подбор — через скрининг, письма и
# онбординг — к двум переиспользуемым инструментам (финальный проект).
# Все артефакты — в sandbox/hr/. Всё работает офлайн, реальные данные
# кандидатов в облако не таскаем (атом hr/00-candidate-data.md).

missions:
  - id: m01-vacancy-and-profile
    file: m01-vacancy-and-profile.md
    title: Вакансия и профиль кандидата
    goal: >
      Превратить мутную заявку нанимающего менеджера в профиль кандидата
      с проверяемыми критериями (must / nice / стоп-сигналы) и собрать
      по нему страницу вакансии.
    criteria:
      - sandbox/hr/profile.md с блоками Must-have, Nice-to-have, Стоп-сигналы
      - sandbox/hr/vacancy/index.html открывается в браузере
      - ученик объясняет, как проверит каждый must-критерий по резюме

  - id: m02-screening-batch
    file: m02-screening-batch.md
    title: Стопка откликов за вечер
    goal: >
      Прогнать пачку резюме через агента по критериям из профиля и получить
      сравнительную таблицу с вердиктами — шортлист за вечер, а не за неделю.
    criteria:
      - sandbox/hr/screening/resumes/ с 6+ тестовыми резюме
      - sandbox/hr/screening/report.md — таблица кандидат × критерии + вердикты
      - ученик спорит с хотя бы одним вердиктом и правит критерии

  - id: m03-candidate-letters
    file: m03-candidate-letters.md
    title: Письма кандидатам без копипасты
    goal: >
      Из шаблона и таблицы скрининга сгенерировать персональные письма
      каждому кандидату — и проверить факты в них против резюме.
    criteria:
      - шаблоны invite.md и decline.md с плейсхолдерами
      - sandbox/hr/letters/out/ — письмо каждому кандидату из report.md
      - ученик показывает, откуда в письме взята персонализация

  - id: m04-onboarding-base
    file: m04-onboarding-base.md
    title: Онбординг — база знаний первого дня
    goal: >
      Вытащить онбординг из головы в файлы — FAQ и чек-лист — и собрать
      из них welcome-страницу; завести git в sandbox/hr.
    criteria:
      - sandbox/hr/onboarding/faq.md — 10+ вопросов-ответов
      - sandbox/hr/onboarding/checklist.md — День 1 / Неделя 1 / Месяц 1
      - sandbox/hr/onboarding/index.html — welcome-страница
      - git-история в sandbox/hr

final_project:
  id: project
  file: project.md
  title: Скринер резюме + бот онбординга
  goal: >
    Собрать под ведением агента два переиспользуемых инструмента:
    скринер резюме (страница, куда вставляешь резюме — получаешь таблицу
    соответствия критериям и вердикт-подсказку) и бот онбординга
    (локальная чат-страница, отвечающая на вопросы новичка по FAQ).
  criteria:
    - sandbox/hr/tools/PLAN.md — план из проверяемых шагов
    - sandbox/hr/tools/screener/index.html — работающий скринер
    - sandbox/hr/tools/onboarding-bot/index.html — работающий бот
    - git-история минимум из 3 коммитов
    - живое демо — 2 резюме через скринер, 3 вопроса боту

pass_threshold_default: 70
