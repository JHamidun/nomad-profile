# Пути, снятые с поставки Nomad (задача M-071). Самопроверка плагина на старте удаляет их из профиля.
#
# Зачем отдельный список. Перенос пакета в профиль (`hermes profile update` и синхронизация на
# старте) заменяет только то, что пакет поставляет сейчас: корень, который пакет перестал возить
# (старый хук hooks/<имя>, скин skins/<имя>.yaml, второй плагин plugins/<имя>), остаётся в профиле
# навсегда — ядро не знает, что он снят. Удалить его может только этот список.
#
# Формат — список записей {path, reason}:
#   path    путь от корня профиля через «/», как в distribution_owned: без «..», «.», «\», «:»,
#           ведущего «/», шаблонов «*?», «~» (короткое имя Windows), пробела по краям сегмента и
#           точки в его конце — и написанный ровно так, как имя лежит на диске (регистр тоже);
#   reason  зачем снят — попадает в журнал при удалении. Запись без причины не исполняется.
# Никогда не удаляются, в любом регистре: пользовательские пути ядра (auth.json, .env, memories,
# sessions, logs, …), config.yaml, distribution.yaml, этот файл, plugin-data/; а ещё целый каталог
# верхнего уровня (там лежат корни покупателя), путь через симлинк или junction и путь, который
# пакет всё ещё поставляет. На Windows и macOS «Auth.json», «auth.json.» и «AUTH~1.JSO» — тот же
# файл auth.json, поэтому другое написание — отказ, а не «другой путь».
#
# Запись не убирают, когда путь исчез: профиль, который обновляется через несколько версий сразу,
# должен увидеть всё, что снято за это время.
retired: []
